[project]
name = "literature-monitor"
version = "0.4.2"
description = "A lightweight journal-monitoring workflow"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2,<3",
    "python-multipart>=0.0.20,<1",
    "PyYAML>=6,<7",
    "uvicorn>=0.30,<1",
]

[project.scripts]
literature-monitor = "literature_monitor.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<0.29",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
