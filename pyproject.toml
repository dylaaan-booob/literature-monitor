[project]
name = "literature-monitor"
version = "0.1.0"
description = "A lightweight journal-monitoring workflow"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
]

[project.scripts]
literature-monitor = "literature_monitor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
