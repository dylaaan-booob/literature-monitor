<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Literature Monitor task</title>
  <link rel="stylesheet" href="task_popup.css">
  <script src="task_popup.js" defer></script>
</head>
<body>
  <h1>Literature Monitor task</h1>
  <p id="status" aria-live="polite">Checking this tab…</p>
  <div id="actions" hidden>
    <button id="ready" type="button">Retry companion connection</button>
    <div id="browser-actions" hidden>
      <button id="arm" type="button">Arm next user download (10 seconds)</button>
      <button id="download" type="button">Download current URL with Chrome</button>
      <button id="check" type="button" hidden>Check current download</button>
      <button id="human" type="button">Login or verification needed</button>
      <button id="fallback" type="button" hidden>Publisher path exhausted — try XMU</button>
      <p>Declare exhaustion only after the publisher path cannot supply the selected version. Login alone is not exhaustion.</p>
      <div id="choices"></div>
    </div>
  </div>
</body>
</html>
